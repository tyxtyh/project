services:
  - type: web
    name: eko-bike-backend
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: EMAIL_HOST
        value: smtp.yandex.ru
      - key: EMAIL_PORT
        value: 465
      - key: EMAIL_USER
        sync: false
      - key: EMAIL_PASS
        sync: false
      - key: RECIPIENT_EMAIL
        value: pasha007@eko-bike.ru
      - key: FRONTEND_URL
        sync: false

